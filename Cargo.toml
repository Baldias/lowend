[package]
name = "lowend"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
pyin = "1.2.0"
sys-locale = "0.3.2"

# pyin is slow unoptimized; keep debug builds usable.
[profile.dev.package."*"]
opt-level = 2
